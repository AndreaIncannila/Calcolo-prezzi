const variants={"VERTICA ZIP":["ACRILICO (GH / Infinity)","CRISTAL","INVERNALE","PVC302","SOLTIS 96","ZANZARIERA"],"VERTICA ZIP 2 RULLI":["ACRILICO (GH / Infinity)","CRISTAL","INVERNALE","PVC302","SOLTIS 96","ZANZARIERA"],"MAGIKA ZIP MONO RULLO":["CRISTAL","TELO ESTIVO","TELO INVERNALE 2210","ZANZARIERA"],"MAGIKA ZIP 2 RULLI BRACCI":["ESTIVO + ZANZARIERA","ESTATE + INVERNO","ESTIVO + CRISTAL"],"ERMETICA CADUTA 1 RULLO":["TELO ESTIVO","TELO INVERNALE 2210"],"ERMETICA BRACCI 2 RULLI":["PREZZO BASE LISTINO"],"ERMETICA CADUTA 2 RULLI":["PREZZO BASE LISTINO"],"ERMETICA 180":["PREZZO BASE LISTINO"],"ERMETICA PLUS":["PREZZO BASE LISTINO"],"MAGIKA CADUTA 1 RULLO":["TELO ESTIVO","TELO INVERNALE 2210"],"MAGIKA BRACCI 1 RULLO":["TELO ESTIVO","TELO INVERNALE 2210"],"MAGIKA BRACCI 2 RULLI":["PREZZO BASE LISTINO"],"MAGIKA BRACCI + FRANGIVENTO 1 RULLO":["TELO ESTIVO","TELO INVERNALE 2210"],"MAGIKA BRACCI + FRANGIVENTO 2 RULLI":["PREZZO BASE LISTINO"]};

function euro(n){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n)}

function updateVariant(){
  const m=document.getElementById('model').value;
  const box=document.getElementById('variantBox');
  const doubleBox=document.getElementById('doubleFabricBox');
  const sel=document.getElementById('variant');
  const f1=document.getElementById('fabric1');
  const f2=document.getElementById('fabric2');
  sel.innerHTML=''; f1.innerHTML=''; f2.innerHTML='';
  const vv=variants[m]||[];

  if(m==='VERTICA ZIP 2 RULLI'){
    box.classList.add('hidden');
    doubleBox.classList.remove('hidden');
    vv.forEach(v=>{
      const o1=document.createElement('option'); o1.value=v; o1.textContent=v; f1.appendChild(o1);
      const o2=document.createElement('option'); o2.value=v; o2.textContent=v; f2.appendChild(o2);
    });
  } else if(vv.length){
    doubleBox.classList.add('hidden');
    vv.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o)});
    box.classList.remove('hidden');
  } else {
    box.classList.add('hidden');
    doubleBox.classList.add('hidden');
  }
}

function calc(){
 const m=document.getElementById('model').value;
 const w=+document.getElementById('w').value;
 const d=+document.getElementById('d').value;
 const vv=variants[m]||[];

 if(!m||!w||!d){alert('Seleziona il modello e inserisci entrambe le misure.');return}

 const marca=document.getElementById('motor').value;
 const supplementoMotore = marca==='TEKNOS' ? 400 : (marca==='SOMFY' ? 500 : 0);
 const box=document.getElementById('res');
 box.style.display='block';

 function findRow(variant){
   return rows
     .filter(x=>x.m===m && x.v===variant && x.w>=w && x.d>=d)
     .sort((a,b)=>a.w-b.w || a.d-b.d)[0];
 }

 if(m==='VERTICA ZIP 2 RULLI'){
   const v1=document.getElementById('fabric1').value;
   const v2=document.getElementById('fabric2').value;
   const r1=findRow(v1);
   const r2=findRow(v2);

   if(!r1 || !r2){
     document.getElementById('price').textContent='Misura non disponibile';
     document.getElementById('bracket').textContent='';
     document.getElementById('extra').innerHTML='<div class="warn">Uno dei due tessuti non è disponibile per le misure inserite.</div>';
     return;
   }

   const prezzoTessuti = r1.p + r2.p;
   const totale = prezzoTessuti + supplementoMotore;

   document.getElementById('price').textContent=euro(totale);
   document.getElementById('bracket').textContent=
     'Scaglione tessuto 1: '+r1.w+' × '+r1.d+' cm · Scaglione tessuto 2: '+r2.w+' × '+r2.d+' cm';

   let notes=[];
   notes.push('Tessuto 1 — '+v1+': '+euro(r1.p));
   notes.push('Tessuto 2 — '+v2+': '+euro(r2.p));
   notes.push('<strong>Somma dei due tessuti: '+euro(prezzoTessuti)+'</strong>');
   if(supplementoMotore>0) notes.push('Supplemento motore '+marca+': +'+euro(supplementoMotore));
   if(document.getElementById('led').value==='SÌ') notes.push('LED selezionato: supplemento LED non ancora sommato automaticamente.');

   document.getElementById('extra').innerHTML=
     '<div class="info">'+notes.join('<br>')+'<br><strong>Totale visualizzato: '+euro(totale)+'</strong></div>';
   return;
 }

 const v=vv.length ? document.getElementById('variant').value : '';
 let valid=rows.filter(x=>x.m===m && x.w>=w && x.d>=d);
 if(vv.length) valid=valid.filter(x=>x.v===v);
 valid.sort((a,b)=>a.w-b.w || a.d-b.d);
 const r=valid[0];

 if(!r){
   document.getElementById('price').textContent='Misura non disponibile';
   document.getElementById('bracket').textContent='';
   document.getElementById('extra').innerHTML='<div class="warn">Le misure inserite superano gli scaglioni presenti nel listino per questa configurazione.</div>';
   return;
 }

 const totale=r.p+supplementoMotore;
 document.getElementById('price').textContent=euro(totale);
 document.getElementById('bracket').textContent='Scaglione utilizzato: '+r.w+' × '+r.d+' cm';

 let notes=[];
 if(v) notes.push('Configurazione: '+v);
 notes.push('Prezzo tenda da tabella: '+euro(r.p));
 if(supplementoMotore>0) notes.push('Supplemento motore '+marca+': +'+euro(supplementoMotore));
 if(document.getElementById('led').value==='SÌ') notes.push('LED selezionato: supplemento LED non ancora sommato automaticamente.');

 document.getElementById('extra').innerHTML='<div class="info">'+notes.join('<br>')+'<br><strong>Totale visualizzato: '+euro(totale)+'</strong></div>';
}

updateVariant();
</script>
<script>
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  const b=document.getElementById('installBtn');
  if(b) b.style.display='block';
});
async function installApp(){
  if(!deferredPrompt){
    alert('Apri il menu di Chrome e scegli "Installa app" oppure "Aggiungi a schermata Home".');
    return;
  }
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  const b=document.getElementById('installBtn');
  if(b) b.style.display='none';
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));
}
</script>
